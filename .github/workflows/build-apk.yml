name: CineVerse Android and Web Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Build release APK
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: flutter build apk --release --dart-define=OMDB_API_KEY="$OMDB_API_KEY"
      - name: Build web release
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: flutter build web --release --dart-define=OMDB_API_KEY="$OMDB_API_KEY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 14
